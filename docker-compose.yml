services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: sh -c "alembic upgrade head && python -m app.worker"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_studio
      POSTGRES_USER: social_studio
      POSTGRES_PASSWORD: social_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_studio -d social_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
